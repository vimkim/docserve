<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare Git versions</title>
  <link rel="stylesheet" href="/__serve_html__/compare.css">
  <script type="module" src="/__serve_html__/compare.js"></script>
</head>
<body>
  <header>
    <a id="compare-close">Back to document</a>
    <label for="compare-revision">Left version</label>
    <select id="compare-revision" disabled></select>
    <button id="compare-left-prev" type="button" disabled>Previous left version</button>
    <button id="compare-left-next" type="button" disabled>Next left version</button>
    <label for="compare-right">Right version</label>
    <select id="compare-right" disabled></select>
    <button id="compare-right-prev" type="button" disabled>Previous right version</button>
    <button id="compare-right-next" type="button" disabled>Next right version</button>
    <button id="compare-refresh" type="button">Refresh comparison</button>
    <button id="compare-prev" type="button" disabled>Previous change</button>
    <button id="compare-next" type="button" disabled>Next change</button>
    <label><input id="compare-sync" type="checkbox" checked> Sync scrolling</label>
    <span id="compare-status" role="status" aria-live="polite">Loading history...</span>
  </header>
  <p class="description">Rendered content comparison. Styles, images, canvas, and pixels are not compared. Relative historical assets use the selected commit. Up to 100 first-parent file revisions are available.</p>
  <div class="panes">
    <section>
      <h1>Left version</h1>
      <div class="pane">
        <iframe id="compare-before" title="Left version" data-docserve-document></iframe>
        <div class="ruler old" id="compare-old-ruler" role="navigation" aria-label="Left change overview">
          <div class="viewport"></div>
          <div class="marks"></div>
          <div class="bands"></div>
        </div>
      </div>
    </section>
    <section>
      <h1>Right version</h1>
      <div class="pane">
        <iframe id="compare-after" title="Right version" data-docserve-document></iframe>
        <div class="ruler new" id="compare-new-ruler" role="navigation" aria-label="Right change overview">
          <div class="viewport"></div>
          <div class="marks"></div>
          <div class="bands"></div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
