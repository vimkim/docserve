<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>HTML preview</title>
  <link rel="stylesheet" href="/__serve_html__/document-navigation.css">
  <link rel="stylesheet" href="/__serve_html__/navigation.css">
  <script type="module" src="/__serve_html__/document-navigation.js"></script>
</head>
<body class="html-document" data-docserve-html-viewer>
  <header class="toolbar">
    <span id="filename">HTML preview</span>
    <nav aria-label="Document"><a href="./">Directory listing</a><a href="/">Go to root</a><a href="{{source}}">Open standalone</a></nav>
  </header>
  <main id="html-content"><iframe id="document-frame" data-docserve-document title="Document" src="{{source}}" allowfullscreen></iframe></main>
  <noscript>HTML is shown below the toolbar. Enable JavaScript for the directory pane and compact controls.</noscript>
</body>
</html>
