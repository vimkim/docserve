<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title description">
  <title id="title">From an SSH terminal to a document in your browser</title>
  <desc id="description">An illustrated workflow: run docserve docs/review.md on a remote server, open the printed URL on your computer, and browse the document and its neighboring files.</desc>
  <rect width="1200" height="450" rx="24" fill="#eef5f2"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="42" y="48" font-size="16" font-weight="700" letter-spacing="2" fill="#346b58">REMOTE FILES. ONE COMMAND. YOUR BROWSER.</text>
    <text x="40" y="105" font-size="46" font-weight="750" fill="#162e29">Write. Open. Read. Repeat.</text>
    <rect x="40" y="138" width="530" height="264" rx="14" fill="#152b27"/>
    <circle cx="65" cy="163" r="5" fill="#f28b82"/>
    <circle cx="83" cy="163" r="5" fill="#f5cf75"/>
    <circle cx="101" cy="163" r="5" fill="#8cd6b6"/>
    <text x="540" y="169" text-anchor="end" font-size="15" fill="#b6cbc2">SSH terminal</text>
    <g font-family="ui-monospace, 'DejaVu Sans Mono', monospace">
      <text x="64" y="214" font-size="21" fill="#b5f2cf">$ docserve docs/review.md</text>
      <text x="64" y="258" font-size="17" fill="#b6cbc2">Root directory:</text>
      <text x="64" y="284" font-size="17" fill="#f3faf6">http://100.64.0.12:7777/</text>
      <text x="64" y="329" font-size="17" fill="#b6cbc2">Selected path:</text>
      <text x="64" y="355" font-size="17" fill="#f3faf6">http://100.64.0.12:7777/docs/review.md</text>
    </g>
    <path d="M584 270h32m-11-11 11 11-11 11" fill="none" stroke="#346b58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="630" y="138" width="530" height="264" rx="14" fill="#fff" stroke="#c9dcd2" stroke-width="2"/>
    <path d="M630 184h530" stroke="#dce8e1" stroke-width="2"/>
    <text x="654" y="167" font-size="15" fill="#526d61">Your browser</text>
    <rect x="1007" y="150" width="128" height="24" rx="12" fill="#eef5f2"/>
    <text x="1071" y="167" text-anchor="middle" font-size="13" font-weight="600" fill="#346b58">Nearby files ↗</text>
    <text x="659" y="231" font-size="27" font-weight="700" fill="#162e29">Review notes</text>
    <rect x="660" y="250" width="444" height="8" rx="4" fill="#dce8e1"/>
    <rect x="660" y="267" width="368" height="8" rx="4" fill="#e9f0ec"/>
    <rect x="660" y="294" width="134" height="50" rx="9" fill="#eef5f2"/>
    <text x="727" y="325" text-anchor="middle" font-size="16" fill="#346b58">Understand</text>
    <path d="M807 319h30m-8-8 8 8-8 8" fill="none" stroke="#6c9684" stroke-width="2"/>
    <rect x="851" y="294" width="134" height="50" rx="9" fill="#eef5f2"/>
    <text x="918" y="325" text-anchor="middle" font-size="16" fill="#346b58">Decide</text>
    <text x="660" y="376" font-size="16" fill="#526d61">Markdown · HTML · diagrams · math</text>
    <text x="42" y="430" font-size="15" fill="#526d61">Illustrated workflow · example address and port</text>
  </g>
</svg>
